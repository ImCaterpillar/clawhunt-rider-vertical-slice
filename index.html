<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑手报名演示</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#18312f;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}.top{background:#155f52;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:18px}.layout{max-width:760px;margin:24px auto;padding:0 16px}.panel{background:#fff;border:1px solid #d8e3df;border-radius:6px;padding:20px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:4px;background:#156d5d;color:white;padding:10px 14px;font-size:15px;cursor:pointer}button.secondary{background:#e7efec;color:#173b36;border:1px solid #c9d9d4}button:disabled{opacity:.48;cursor:not-allowed}input[type=text]{padding:10px;border:1px solid #bdcbc6;border-radius:4px;min-width:0;flex:1;font-size:16px}label{display:flex;align-items:center;gap:9px;min-height:42px}input[type=checkbox]{width:20px;height:20px;accent-color:#156d5d}.progress{height:9px;background:#e2eae7;border-radius:6px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:#d47838;transition:width .2s}.muted{color:#526a64;font-size:14px}.status{min-height:24px;color:#155f52;font-weight:600}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.slot{border:1px solid #d8e3df;padding:8px;border-radius:4px;font-size:14px}.danger{color:#8a3b31}header+main{padding-bottom:30px}@media(max-width:520px){.slots{grid-template-columns:1fr}.panel{padding:15px}.layout{margin-top:14px}}
</style>
</head>
<body>
<header class="top"><strong>骑手报名</strong><span><span id="network">在线</span> · 演示环境 · 合成数据</span></header>
<main class="layout">
<section class="panel"><h1 style="font-size:21px;margin:0 0 8px">报名与站点预约</h1><div class="muted">此页面只连接本机 API 演示。请勿输入真实个人信息。</div><p><label><input id="consent" type="checkbox">我同意使用合成信息进行本次演示</label></p><div class="row"><button id="start">开始报名</button><button id="revoke" class="secondary" disabled>撤回并清除</button><span id="session" class="muted"></span></div></section>
<section class="panel"><h2 style="font-size:17px;margin:0">报名进度</h2><div class="progress"><div id="bar" class="bar"></div></div><div id="progress" class="muted">0/7</div><div class="slots" id="slots"></div></section>
<section class="panel"><h2 style="font-size:17px;margin:0 0 12px">输入演示信息</h2><div class="row"><input id="message" type="text" placeholder="例如 name=Chen birth_ym=1998-05 area=Haidian" aria-label="演示报名信息"><button id="send" disabled>提交信息</button></div><p class="muted">支持 name=、birth_ym=、area=、job_type=、has_ebike=、start_date=、experience= 七个演示槽位。</p><div class="row"><button id="book" disabled>预约演示名额</button><span id="status" class="status" role="status"></span></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let sid=null;const names=['name','birth_ym','area','job_type','has_ebike','start_date','experience'];
const SESSION_KEY='rider-demo-session';const PENDING_KEY='rider-demo-pending';
function online(){ $('network').textContent=navigator.onLine?'在线':'离线 · 输入已暂存，恢复后重试'; }
addEventListener('online',async()=>{online();await restoreSession(true)});addEventListener('offline',online);online();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
function showSlots(n){$('progress').textContent=`${n}/7`; $('bar').style.width=`${n/7*100}%`; $('slots').innerHTML=names.map((x,i)=>`<div class="slot">${i<n?'✓':'○'} ${x}</div>`).join('')}
async function api(path,method='GET',body){if(!navigator.onLine)throw new Error('当前离线，输入已保留，请联网后重试');const r=await fetch('http://127.0.0.1:8765'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
function setSession(id){sid=id;localStorage.setItem(SESSION_KEY,id);$('session').textContent='会话 '+id.slice(0,8);$('send').disabled=false;$('revoke').disabled=false}
async function restoreSession(retryPending=false){const saved=localStorage.getItem(SESSION_KEY);if(!saved)return;setSession(saved);const pending=localStorage.getItem(PENDING_KEY);if(pending!==null)$('message').value=pending;if(!navigator.onLine)return;try{const state=await api(`/api/v1/sessions/${saved}`);$('consent').checked=Boolean(state.consent_version);showSlots(Number(state.progress.split('/')[0]));$('book').disabled=state.status!=='complete';if(retryPending&&pending!==null)await submitMessage(pending)}catch(e){if(e.message.includes('SESSION_NOT_FOUND')){localStorage.removeItem(SESSION_KEY);localStorage.removeItem(PENDING_KEY)}}}
$('start').onclick=async()=>{try{if(!$('consent').checked)throw Error('请先勾选演示同意');const x=await api('/api/v1/sessions','POST');setSession(x.session_id);await api(`/api/v1/sessions/${sid}/consent`,'POST',{version:'demo-v1'});$('status').textContent='已同意，开始填写';}catch(e){$('status').textContent=e.message}};
async function submitMessage(text){const x=await api(`/api/v1/sessions/${sid}/message`,'POST',{text});localStorage.removeItem(PENDING_KEY);showSlots(Number(x.progress.split('/')[0]));$('status').textContent=x.status==='end_minor'?'未成年分支：流程已礼貌终止':`已处理；下游安全输入：${x.model_input}`;$('book').disabled=x.status!=='complete';return x}
$('send').onclick=async()=>{const text=$('message').value;localStorage.setItem(PENDING_KEY,text);try{await submitMessage(text)}catch(e){$('status').textContent=e.message}};
$('book').onclick=async()=>{try{const x=await api(`/api/v1/sessions/${sid}/book`,'POST',{station:'demo-station'});$('status').textContent=`预约成功，剩余演示名额 ${x.remaining}`}catch(e){$('status').textContent=e.message}};
$('revoke').onclick=async()=>{try{await api(`/api/v1/sessions/${sid}/consent`,'DELETE');sid=null;localStorage.removeItem(SESSION_KEY);localStorage.removeItem(PENDING_KEY);$('message').value='';$('session').textContent='';$('send').disabled=true;$('book').disabled=true;$('revoke').disabled=true;$('consent').checked=false;showSlots(0);$('status').textContent='已撤回并清除演示数据'}catch(e){$('status').textContent=e.message}};
showSlots(0);restoreSession();
</script>
</body></html>
